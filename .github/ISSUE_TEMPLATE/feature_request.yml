name: Feature request
description: Propose a focused improvement to WebXR, Meta Quest/XR, Android, gameplay, accessibility, or developer experience
title: "[Feature] "
labels: []
body:
  - type: dropdown
    id: platform
    attributes:
      label: Platform / edition
      options:
        - WebXR / mobile AR
        - Meta Quest / headset XR
        - Native Android
        - Shared gameplay / cross-platform
        - Developer experience
        - Other
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem or opportunity
      description: What is missing, difficult, or worth improving?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: Describe the smallest useful version of the idea.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: What would make this complete?
      description: List concrete acceptance criteria if possible.
