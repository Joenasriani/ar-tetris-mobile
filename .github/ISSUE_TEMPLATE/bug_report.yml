name: Bug report
description: Report a reproducible gameplay, XR, UI, build, or device issue
title: "[Bug] "
labels: []
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve Spatial Tetris XR. Reproducible reports are the most useful.
  - type: dropdown
    id: platform
    attributes:
      label: Platform / edition
      options:
        - WebXR / mobile AR
        - Meta Quest / headset XR
        - Native Android
        - Shared gameplay / cross-platform
        - Other
    validations:
      required: true
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the problem clearly.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Start the relevant edition
        2. ...
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device / headset
      placeholder: e.g. Pixel 8, Galaxy S24, Meta Quest 3
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Browser / OS / Android version
      placeholder: e.g. Quest Browser version, Chrome on Android, Android 16
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Screenshot, recording, or logs
      description: Add anything that makes the issue easier to reproduce.
